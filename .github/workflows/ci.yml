name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

# Cancel a superseded run when a new commit is pushed to the same ref/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test (100% coverage) & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # NOTE: NODE_ENV is intentionally left unset — `next build` must run as
    # production, and forcing NODE_ENV=test breaks its error-page prerender.
    env:
      DATABASE_URL: postgresql://school:school@localhost:5432/school_portal
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-please-do-not-reuse-0123456789
      GROQ_API_KEY: test-groq-key-not-real # chat tests mock the HTTP call; key only gates the "configured" check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate & seed the test database
        run: |
          npm run migrate -w api
          npm run seed -w api

      - name: Test with coverage (fails below 100%)
        run: npm run coverage

      - name: Build all services
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://school:school@localhost:5432/school_portal
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-please-do-not-reuse-0123456789
      GROQ_API_KEY: test-groq-key-not-real # chat tests mock the HTTP call; key only gates the "configured" check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        # No --with-deps: the ubuntu-latest runner already ships Chromium's
        # system libraries, and the apt step it triggers is slow/flaky.
        run: npx playwright install chromium

      - name: Run E2E tests
        # Playwright's globalSetup migrates + seeds; webServer boots api + web.
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Docker Hub publish — builds both images from the multi-stage root
  # Dockerfile (api + web targets). Guarded on the repo secrets actually
  # being set, so a fork or a repo without them configured still passes CI
  # instead of failing on a missing login.
  docker:
    name: Build & push images
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/concentrate-school-portal-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/concentrate-school-portal-web:latest
